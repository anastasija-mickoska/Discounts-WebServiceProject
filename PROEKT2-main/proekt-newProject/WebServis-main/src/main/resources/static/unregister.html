<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unregister</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }

        form {
            display: inline-block;
            text-align: left;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        input {
            display: block;
            width: 90%;
            margin: 10px 0;
            padding: 8px;
        }

        button {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
            width: 80%;
            margin-left: 10%;
        }

        button:hover {
            background-color: #c82333;
        }

        #message {
            margin-top: 10px;
            color: red;
        }
    </style>
</head>

<body>

    <h2>Unregister</h2>
    <form id="unregisterForm">
        <label>Username:</label>
        <input type="text" id="username" required>

        <label>Password:</label>
        <input type="password" id="password" required>

        <button type="submit">Unregister</button>
    </form>

    <p id="message"></p>
    <br>
    <a href="index.html">Back to Home</a>

    <script>
        const token = localStorage.getItem("token");
        document.getElementById("unregisterForm").addEventListener("submit", function (event) {
            event.preventDefault();
            fetch("/api/v1/auth/unregister", {
                method: "DELETE",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                }
            })
                .then(response => {
                    if (response.status === 204) { 
                        return null;
                    }
                    return response.json(); 
                })
                .then(data => {
                    if (data.token) {
                        window.location.href = "index.html";
                    } else {
                        document.getElementById("message").innerText = data.message || "Unregister failed";
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    document.getElementById("message").innerText = "An error occurred. Please try again.";
                });
        });

    </script>

</body>

</html>
